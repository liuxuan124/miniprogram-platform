# 公众号内容镜像站点
# 放到 /etc/nginx/sites-available/ 下，然后 ln -s 到 sites-enabled
# 产物目录由 sync_wechat.py 写入 /opt/wechat-sync/out

server {
    listen 80;
    server_name wechat.zfculture.site;   # 改成你的域名

    root /opt/wechat-sync/out;
    index index.html;

    # 中文文件名编码
    charset utf-8;

    # 图片缓存（内容不变，文件名是 md5）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 禁止列目录
    autoindex off;

    access_log /var/log/nginx/wechat.access.log;
    error_log  /var/log/nginx/wechat.error.log;
}
